<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wi-Fi Voucher Claiming System</title>

  <script src="https://accounts.google.com/gsi/client"
          async
          defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .login {
      text-align: center;
      margin-bottom: 25px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #e6f4ea;
      color: #137333;
    }

    .error {
      background: #fce8e6;
      color: #c5221f;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Wi-Fi Voucher Claiming System</h1>

    <div class="subtitle">
      Please sign in using your Google account.
    </div>

    <!-- Google Sign-In -->
    <div class="login">

      <div id="g_id_onload"
           data-client_id="246226290725-09mch4s4736vbd1m80qsdr89ms4f95ha.apps.googleusercontent.com"
           data-callback="handleGoogleCredential"
           data-auto_prompt="false">
      </div>

      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="sign_in_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>

    </div>

    <div id="result"></div>

  </div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwChbGU-uAf_10ybS2bh3KbBCXLkhM5BE6Xi75RyklPAUP2lb3peoe7GxnTCinrF-_C5g/exec";


let googleCredential = null;


/*
 * Google Sign-In callback
 */
function handleGoogleCredential(response) {

  console.log(
    "Google Sign-In callback fired."
  );


  googleCredential =
    response.credential;


  if (!googleCredential) {

    showResult(
      "Google Sign-In was completed, but no authentication token was received.",
      "error"
    );

    return;
  }


  console.log(
    "Google ID token received."
  );


  showResult(
    "Google account signed in. Verifying your account...",
    "success"
  );


  verifyGoogleAccount(
    googleCredential
  );

}


/*
 * Verify Google account through
 * Apps Script JSONP.
 */
function verifyGoogleAccount(
  idToken
) {

  console.log(
    "Starting Google account verification..."
  );


  /*
   * Create a unique callback name.
   */
  const callbackName =
    "googleVerificationCallback_" +
    Date.now();


  /*
   * Create the callback function
   * on the GitHub page.
   */
  window[callbackName] =
    function(result) {

      console.log(
        "Apps Script verification result:",
        result
      );


      /*
       * Remove the temporary callback.
       */
      delete window[callbackName];


      /*
       * Remove the script element.
       */
      if (scriptElement) {

        scriptElement.remove();

      }


      if (
        !result ||
        !result.success
      ) {

        showResult(

          result &&
          result.message

            ? result.message

            : "Google account verification failed.",

          "error"

        );

        return;

      }


      /*
       * Verification succeeded.
       */
      showResult(

        "Google account successfully verified. Your account is ready for voucher claiming.",

        "success"

      );


      /*
       * Keep verified account information
       * available for the next step.
       */
      window.verifiedGoogleAccount =
        result;


      console.log(
        "Verified Google email:",
        result.email
      );

    };


  /*
   * Create script element.
   *
   * JSONP works because the browser permits
   * cross-origin <script> loading.
   */
  const scriptElement =
    document.createElement("script");


  scriptElement.src =
    APPS_SCRIPT_URL +
    "?action=verify" +
    "&token=" +
    encodeURIComponent(idToken) +
    "&callback=" +
    encodeURIComponent(callbackName);


  /*
   * Handle connection failure.
   */
  scriptElement.onerror =
    function() {

      console.error(
        "Unable to load Apps Script verification endpoint."
      );


      delete window[callbackName];


      showResult(
        "Unable to connect to the Wi-Fi Voucher System. Please try again.",
        "error"
      );


      scriptElement.remove();

    };


  document.body.appendChild(
    scriptElement
  );


  console.log(
    "Apps Script verification request sent."
  );

}


/*
 * Display notification.
 */
function showResult(
  message,
  type
) {

  const result =
    document.getElementById(
      "result"
    );


  result.textContent =
    message;


  result.className =
    type;


  result.style.display =
    "block";

}

</script>

</body>
</html>
